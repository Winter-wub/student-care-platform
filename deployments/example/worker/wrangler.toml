# Issue #5 throwaway prototype. Workers Paid is the baseline (issue #6).
# Delete with: npx wrangler@4 delete harpseal-proto-example
#              npx wrangler@4 d1 delete harpseal-proto
name = "harpseal-proto-example"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
account_id = "ce591e55e40551fc70aa9020ccd73137"
workers_dev = true

[build]
command = "cargo install -q worker-build && worker-build --release"

[[d1_databases]]
binding = "DB"
database_name = "harpseal-proto"
database_id = "2a809205-9ca6-4b45-ae79-8c522225d6a6"
