[package]
name = "harpseal-example-worker"
version = "0.0.0"
edition.workspace = true
rust-version = "1.91"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
harpseal.workspace = true
example-deployment.workspace = true
harpseal-runtime-cloudflare.workspace = true
worker.workspace = true

# Built with the workspace's `wasm-release` profile (release + panic "abort").
# wasm-opt -Oz runs explicitly in wrangler.toml's [build] command, after
# `worker-build --profile wasm-release --no-opt`.
