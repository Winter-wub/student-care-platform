[package]
name = "harpseal-example-worker"
version = "0.0.0"
edition.workspace = true
rust-version = "1.91"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
harpseal.workspace = true
example-deployment.workspace = true
harpseal-runtime-cloudflare.workspace = true
worker.workspace = true

# The release profile is the workspace's (opt-level "z", lto, codegen-units 1,
# panic "abort", strip). wasm-opt -Oz runs explicitly in wrangler.toml's
# [build] command, after `worker-build --no-opt`.
