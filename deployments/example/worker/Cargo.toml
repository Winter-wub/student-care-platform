[package]
name = "example-worker"
version = "0.0.0"
edition.workspace = true
rust-version = "1.91"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Issue #5 measurement (e): calamine on wasm32, `POST /bench/xlsx`.
xlsx = ["dep:calamine"]

[dependencies]
harpseal.workspace = true
example-deployment.workspace = true
harpseal-runtime-cloudflare = { path = "../../../crates/harpseal-runtime-cloudflare" }
worker.workspace = true
harpseal-channel-line.workspace = true
harpseal-channel-telegram.workspace = true
axum = { workspace = true, features = ["query"] }
tower-service = "0.3"
serde.workspace = true
calamine = { workspace = true, optional = true }
web-sys = { version = "0.3", features = ["Crypto", "SubtleCrypto", "CryptoKey", "Pbkdf2Params"] }

# worker-build runs `wasm-opt -O` by default; -Oz measured smaller (issue #5).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-exception-handling", "--enable-bulk-memory", "--enable-nontrapping-float-to-int", "--enable-sign-ext", "--enable-mutable-globals", "--enable-reference-types", "--enable-multivalue"]
