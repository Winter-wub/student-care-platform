[workspace]
resolver = "2"
members = [
    "crates/harpseal",
    "crates/harpseal-channel-line",
    "crates/harpseal-channel-telegram",
    "crates/harpseal-channel-fake",
    "crates/harpseal-runtime-cloudflare",
    "crates/harpseal-runtime-native",
    "crates/harpseal-cli",
    "crates/harpseal-testing",
    "deployments/example/deployment",
    "deployments/example/native",
    "deployments/example/worker",
    "deployments/example/e2e",
]

[workspace.package]
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
repository = "https://github.com/Winter-wub/student-care-platform"
homepage = "https://github.com/Winter-wub/student-care-platform"
readme = "README.md"

[workspace.dependencies]
harpseal = { path = "crates/harpseal", version = "0.1.0" }
harpseal-channel-line = { path = "crates/harpseal-channel-line", version = "0.1.0" }
harpseal-channel-telegram = { path = "crates/harpseal-channel-telegram", version = "0.1.0" }
harpseal-channel-fake = { path = "crates/harpseal-channel-fake", version = "0.1.0" }
harpseal-runtime-native = { path = "crates/harpseal-runtime-native", version = "0.1.0" }
harpseal-runtime-cloudflare = { path = "crates/harpseal-runtime-cloudflare", version = "0.1.0" }
# Path only: a dev-dependency of the crates it tests (cycles), which cargo
# drops when publishing. Customers depend on the published crate.
harpseal-testing = { path = "crates/harpseal-testing" }
harpseal-cli = { path = "crates/harpseal-cli", version = "0.1.0" }
example-deployment = { path = "deployments/example/deployment" }
async-trait = "0.1"
axum = { version = "0.8", default-features = false }
http = "1"
http-body = "1"
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
rusqlite = { version = "0.41", features = ["bundled"] }
getrandom = "0.4"
worker = { version = "0.8", features = ["http", "axum", "d1"] }
maud = "0.27"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }
pbkdf2 = { version = "0.13", default-features = false, features = ["phc", "alloc"] }
sha2 = { version = "0.11", default-features = false }
hmac = "0.13"
calamine = { version = "0.38", default-features = false }

# Argon2id (m=19 MiB, t=2) takes seconds per hash unoptimised; tests log in
# many times, so dev and test builds optimise the hashing crates only.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

# Measured in docs/prototypes/workers-pages.md (issue #5). The native
# binary keeps panic unwinding, so one panicking Job handler or request
# cannot take the whole process down (tokio isolates it per task).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

# The Worker build (wrangler.toml runs `worker-build --profile wasm-release`):
# panic = "abort" as the spec requires; the runtime's panic hook logs the
# message first.
[profile.wasm-release]
inherits = "release"
panic = "abort"
