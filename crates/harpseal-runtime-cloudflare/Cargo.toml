[package]
name = "harpseal-runtime-cloudflare"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
description = "Cloudflare Workers runtime for harpseal: D1, R2, Resend over fetch, Cron, and the fetch/scheduled entry points."
keywords = ["cloudflare", "workers", "d1", "r2", "harpseal"]
categories = ["wasm", "web-programming"]

[dependencies]
harpseal.workspace = true
worker.workspace = true
async-trait.workspace = true
axum.workspace = true
http.workspace = true
tower-service = "0.3"
getrandom = { workspace = true, features = ["wasm_js"] }
# Not used here: enables the Core's "Download all data" writer to read the
# time from JavaScript's `Date`. Without it every workbook panics on wasm32
# (`SystemTime::now()`); Cargo unifies the feature into the Core's copy.
rust_xlsxwriter = { workspace = true, features = ["wasm"] }
