[package]
name = "harpseal"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
description = "The Core of harpseal: a reusable student care platform that serves students over messaging channels (Kernel, message model, Channel and Module traits, back office)."
keywords = ["student", "chatbot", "line", "telegram", "axum"]
categories = ["web-programming", "wasm"]

[dependencies]
async-trait.workspace = true
axum = { workspace = true, features = ["form", "query", "multipart"] }
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
serde.workspace = true
toml.workspace = true
maud.workspace = true
argon2.workspace = true
pbkdf2.workspace = true
sha2.workspace = true
serde_json.workspace = true
calamine.workspace = true
rust_xlsxwriter.workspace = true

# rust_xlsxwriter stamps each workbook with the time; on wasm32 that is
# `SystemTime::now()`, which panics there, unless its `wasm` feature reads
# JavaScript's `Date` instead. A target dependency, not a platform flag.
[target.'cfg(target_arch = "wasm32")'.dependencies]
rust_xlsxwriter = { workspace = true, features = ["wasm"] }

[features]
# Sample first-slice messages for adapter tests (issue #3). Test-only, not a platform flag.
fixtures = []
