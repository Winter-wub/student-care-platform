[package]
name = "harpseal-runtime-native"
version = "0.1.0"
edition.workspace = true
rust-version = "1.91"
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true
description = "Self-hosted runtime for harpseal: SQLite, local or S3 files, SMTP or Resend, axum::serve and a Job ticker on tokio."
keywords = ["sqlite", "tokio", "axum", "self-hosted", "harpseal"]
categories = ["web-programming::http-server"]

[dependencies]
harpseal.workspace = true
async-trait.workspace = true
axum = { version = "0.8", features = ["tokio", "http1"] }
tokio = { workspace = true, features = ["fs", "time", "sync"] }
rusqlite.workspace = true
getrandom.workspace = true
http.workspace = true
# HttpClient port (and S3 / Resend through it). rustls with aws-lc-rs.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# SMTP EmailSender, async on tokio, rustls (aws-lc-rs, same provider as reqwest).
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "webpki-roots"] }
# SigV4 signing for the S3 FileStore (both already in the tree via pbkdf2).
hmac = "0.13"
sha2.workspace = true

[dev-dependencies]
harpseal-testing.workspace = true
harpseal-channel-fake.workspace = true
tokio = { workspace = true, features = ["io-util"] }
